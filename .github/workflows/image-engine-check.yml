name: Portable image engine checks
on:
  push:
    paths: ['image-engine/**', '.github/workflows/image-engine-check.yml']
  pull_request:
    paths: ['image-engine/**', '.github/workflows/image-engine-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm --prefix image-engine test
      - run: npm --prefix image-engine run demo:plan
